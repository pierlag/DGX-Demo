# Prometheus scrape config for the DGX Demo observability stack.
# Scrapes the FastAPI backend's /metrics endpoint (GPU/NVML, vLLM throughput,
# RAG/Qdrant, Copilot CLI activity, energy & CO2) plus vLLM's own /metrics when
# a model is running. The backend + vLLM run on the host, so Prometheus reaches
# them via host.docker.internal (mapped to the host gateway in docker-compose).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dgx-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: backend

  # vLLM exposes native Prometheus metrics at /metrics on its OpenAI port.
  # Down when no model is loaded — Prometheus simply marks the target as off.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: vllm

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
