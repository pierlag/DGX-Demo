# Promtail — discovers the DGX Demo containers via the Docker Engine API and
# ships their logs to Loki under job="dgx". Keeps only containers whose name
# starts with "dgx-demo" (vLLM, Qdrant, TRELLIS). No host log-file paths needed;
# mounts the docker socket read-only.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: dgx-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # keep only the DGX Demo containers
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?dgx-demo.*"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container
        replacement: "$1"
      - target_label: job
        replacement: dgx
